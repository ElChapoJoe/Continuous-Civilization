<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14161f"/>
      <stop offset="1" stop-color="#232838"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8863b"/>
      <stop offset="0.5" stop-color="#e9c77b"/>
      <stop offset="1" stop-color="#b8863b"/>
    </linearGradient>
    <linearGradient id="age" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9894a"/>
      <stop offset="0.5" stop-color="#4f8fbf"/>
      <stop offset="1" stop-color="#8d6fc9"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect x="14" y="14" width="1252" height="292" rx="12" fill="none" stroke="url(#gold)" stroke-opacity="0.55" stroke-width="2"/>

  <text x="640" y="120" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="68" letter-spacing="6" fill="url(#gold)">CONTINUOUS CIVILIZATION</text>
  <text x="640" y="166" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#d9d4c7" font-style="italic">One unbroken campaign for Civilization VII, from the first city to the space race</text>

  <line x1="230" y1="232" x2="1050" y2="232" stroke="url(#age)" stroke-width="6" stroke-linecap="round"/>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="20" text-anchor="middle" letter-spacing="3">
    <circle cx="230" cy="232" r="13" fill="#14161f" stroke="#c9894a" stroke-width="5"/>
    <text x="230" y="276" fill="#d9a46b">ANTIQUITY</text>
    <circle cx="640" cy="232" r="13" fill="#14161f" stroke="#4f8fbf" stroke-width="5"/>
    <text x="640" y="276" fill="#7fb3dc">EXPLORATION</text>
    <circle cx="1050" cy="232" r="13" fill="#14161f" stroke="#8d6fc9" stroke-width="5"/>
    <text x="1050" y="276" fill="#b39ce6">MODERN</text>
